name: Docker

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: Build native image once
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wealthfolio-smoke:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64
          build-args: |
            CONNECT_AUTH_URL=${{ vars.CONNECT_AUTH_URL }}
            CONNECT_AUTH_PUBLISHABLE_KEY=${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
            CONNECT_API_URL=${{ vars.CONNECT_API_URL }}
      - name: Test encryption in the built image
        run: python3 .github/scripts/encryption_smoke.py --image wealthfolio-smoke:ci
      - name: Export tested image for verified deployment
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir image-artifact
          docker save wealthfolio-smoke:ci | gzip -1 > image-artifact/image.tar.gz
          printf '%s\n' "$REVISION" > image-artifact/revision.txt
          (cd image-artifact && sha256sum image.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: wealthfolio-tested-image
          path: image-artifact/
          compression-level: 0
          retention-days: 1
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag"
            docker tag wealthfolio-smoke:ci "$tag"
            docker push "$tag"
          done <<< "$RELEASE_TAGS"
